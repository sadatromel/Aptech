version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=aptech_erp
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-aptech_secret_pass_2026}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://erp.softwebcare.com}
    volumes:
      - app_uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-aptech_secret_pass_2026}
      - MYSQL_DATABASE=aptech_erp
    volumes:
      - db_data:/var/lib/mysql
      - ./backups/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-aptech_secret_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  app_uploads:

